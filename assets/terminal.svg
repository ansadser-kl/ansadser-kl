<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260">
  <style>
    .m{font-family:'Courier New',monospace;font-size:17px}
    .g{fill:#25D366}.w{fill:#e6e6e6}.y{fill:#ffd166}.c{fill:#34B7F1}.d{fill:#7a7f99}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect x="2" y="2" width="756" height="256" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="756" height="38" rx="16" fill="#161b22"/>
  <circle cx="26" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="21" r="7" fill="#27c93f"/>
  <text x="380" y="27" text-anchor="middle" class="m d" font-size="14">anu@poco-m2: ~/bot (Termux)</text>

  <text x="24" y="72" class="m w" opacity="0">
    <tspan class="g">$</tspan> node index.js
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.05;0.95;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="102" class="m d" opacity="0">
    [bot] connecting to WhatsApp...
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.21;0.95;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="132" class="m c" opacity="0">
    [bot] ✓ session restored, online
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.38;0.95;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="162" class="m y" opacity="0">
    [cmd] .menu  →  replied in 0.2s
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.55;0.95;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="192" class="m g" opacity="0">
    [bot] running 24/7 on a phone 📱🔥
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.73;0.95;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="228" class="m w"><tspan class="g">$</tspan> <tspan class="cur">█</tspan></text>
</svg>
